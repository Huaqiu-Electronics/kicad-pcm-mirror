# KiCad PCM 镜像静态服务
# 对外只暴露 /kicad-addons/ 前缀，路径原样保留（规格书 §7.4）

# v1 / v2 分流：KiCad 10+ 请求头包含 application/vnd.kicad.pcm.v2+json，
# 其余（无 Accept 或普通 JSON）返回 v1。
map $http_accept $kicad_repository_file {
    default                                  repository.v1.json;
    ~*application/vnd\.kicad\.pcm\.v2\+json  repository.v2.json;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 审计文件仅用于内部追踪，不对外公开
    location = /kicad-addons/mirror-manifest.json {
        return 404;
    }

    # 稳定入口；两个变体共用一个 URL，靠 Accept 区分
    location = /kicad-addons/repository.json {
        default_type application/json;
        add_header Vary Accept always;
        add_header Cache-Control "no-cache" always;
        try_files /kicad-addons/$kicad_repository_file =404;
    }

    location = /kicad-addons/ {
        return 404;
    }

    # 插件 ZIP：镜像不可变，可长缓存；禁止二次压缩
    location ~* ^/kicad-addons/.+\.zip$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
    }

    # 其余元数据（packages.json / packages-v1.json）随版本变化，不复用旧缓存
    location ~* ^/kicad-addons/.+\.json$ {
        add_header Vary Accept always;
        add_header Cache-Control "no-cache" always;
    }
}
