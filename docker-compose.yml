services:
  mirror:
    image: ${KICAD_MIRROR_IMAGE:-kicad-pcm-mirror:latest}
    build:
      context: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
